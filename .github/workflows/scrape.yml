# Frequent scheduler for the free tier. Vercel Hobby crons can only run once a
# day, so GitHub Actions pings the scrape endpoint instead.
#
# Repo → Settings → Secrets and variables → Actions:
#   SEEK_URL     e.g. https://seek.vercel.app (PEEK_URL also works)
#   CRON_SECRET  same value as in Vercel
#
# Every 5 minutes is the fastest schedule GitHub allows. Starting at :02 avoids
# the busy top of the hour, when GitHub delays or drops the most scheduled runs.
# Actions minutes are free for public repos. A public repo's schedules are
# paused after 60 days with no commits — re-enable from the Actions tab.
name: scrape

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTH: "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      # SEEK_URL is the new name; PEEK_URL (the original name) still works.
      BASE: ${{ secrets.SEEK_URL || secrets.PEEK_URL }}
    steps:
      # Each job decides for itself whether anything is due, so calling all
      # four every 5 minutes is cheap. One failing doesn't stop the others.
      - name: Check tracked products
        continue-on-error: true
        run: curl --fail-with-body -sS --max-time 75 -H "$AUTH" "$BASE/api/cron/scrape"
      - name: Scan shop catalogues
        continue-on-error: true
        run: curl --fail-with-body -sS --max-time 75 -H "$AUTH" "$BASE/api/cron/scan"
      - name: Read drop and deal feeds
        continue-on-error: true
        run: curl --fail-with-body -sS --max-time 75 -H "$AUTH" "$BASE/api/cron/drops"
      - name: Check new shops and find more (weekly)
        continue-on-error: true
        run: curl --fail-with-body -sS --max-time 75 -H "$AUTH" "$BASE/api/cron/shops"
